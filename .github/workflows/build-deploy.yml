name: Build & Deploy workflow

on:
  workflow_call:
    outputs:
      status:
        value: ${{ jobs.deploy.outputs.status }}

jobs:
  build:
    outputs:
      status: ${{ job.status }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          cache: 'yarn'

      - name: Build static
        env:
          PUBLIC_APP_NAME: ${{ vars.PUBLIC_APP_NAME }}
          PUBLIC_APP_DOMAIN: ${{ vars.PUBLIC_APP_DOMAIN }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
          PUBLIC_UNTAPPD_API_URL: ${{ vars.PUBLIC_UNTAPPD_API_URL }}
          PUBLIC_UNTAPPD_OAUTH_URL: ${{ vars.PUBLIC_UNTAPPD_OAUTH_URL }}
          PUBLIC_UNTAPPD_REDIRECT_URL: ${{ vars.PUBLIC_UNTAPPD_REDIRECT_URL }}
          PUBLIC_UNTAPPD_CLIENT_ID: ${{ vars.PUBLIC_UNTAPPD_CLIENT_ID }}
          PRIVATE_UNTAPPD_CLIENT_SECRET: ${{ secrets.PRIVATE_UNTAPPD_CLIENT_SECRET }}
          PRIVATE_UNTAPPD_ACCESS_TOKEN: ${{ secrets.PRIVATE_UNTAPPD_ACCESS_TOKEN }}
          PRIVATE_PRICE_URL: ${{ secrets.PRIVATE_PRICE_URL }}
          PRIVATE_PRICE_TITLE: ${{ secrets.PRIVATE_PRICE_TITLE }}

        run: |
          yarn
          yarn build

  deploy:
    needs: build
    uses: 'Saturnych/actions-workflows/.github/workflows/pages-deploy.yml@develop'
    with:
       dir: './dist'
    secrets: inherit
