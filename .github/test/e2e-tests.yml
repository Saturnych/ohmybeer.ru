name: Playwright tests

on:
  workflow_call:
    outputs:
      status:
        value: ${{ jobs.test.outputs.status }}

jobs:
  test:
    runs-on: ubuntu-latest

    outputs:
      status: ${{ job.status }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'

      - name: Run tests
        env:
          PUBLIC_APP_NAME: ${{ vars.PUBLIC_APP_NAME }}
          PUBLIC_APP_DOMAIN: ${{ vars.PUBLIC_APP_DOMAIN }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
          PRIVATE_PRICE_URL: ${{ secrets.PRIVATE_PRICE_URL }}
          PRIVATE_PRICE_TITLE: ${{ secrets.PRIVATE_PRICE_TITLE }}
          PRIVATE_UNTAPPD_API_URL: ${{ secrets.PRIVATE_UNTAPPD_API_URL }}
          PRIVATE_UNTAPPD_CLIENT_ID: ${{ secrets.PRIVATE_UNTAPPD_CLIENT_ID }}
          PRIVATE_UNTAPPD_CLIENT_SECRET: ${{ secrets.PRIVATE_UNTAPPD_CLIENT_SECRET }}
          PRIVATE_UNTAPPD_ACCESS_TOKEN: ${{ secrets.PRIVATE_UNTAPPD_ACCESS_TOKEN }}
          SHA: ${{ github.sha }}

        run: |
          yarn
          yarn playwright install
          npx playwright test
